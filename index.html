<!DOCTYPE html>
<html>
  <head>
    <title>AR Demo</title>
    <script defer src="ar-loader.js"></script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: white;
        font-family: sans-serif;
      }
      .button-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      button {
        padding: 1em 2em;
        font-size: 1.2em;
        margin: 1em;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="button-container">
      <button id="ios">View in AR (iPhone)</button>
      <button id="android">View in AR (Android)</button>
    </div>
  </body>
</html>

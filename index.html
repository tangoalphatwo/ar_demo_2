<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js Minimal</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: true;"
      renderer="logarithmicDepthBuffer: true;"
    >
      <a-marker
        type="pattern"
        url="markers/marker.patt"
        emitevents="true"
        id="marker"
      ></a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
  window.addEventListener("DOMContentLoaded", () => {
    const marker = document.querySelector("#marker");
    if (!marker) {
      console.error("Marker element not found!");
      return;
    }

    let modelSpawned = false;

    marker.addEventListener("markerFound", () => {
      console.log("markerFound fired");

      if (modelSpawned) return;

      // Create the 3D model
      const model = document.createElement("a-entity");
      model.setAttribute("gltf-model", "models/avocado2.glb"); // Make sure file is in same folder
      model.setAttribute("scale", "0.05 0.05 0.05");
      model.setAttribute("position", "0 0 0"); // At marker origin
      model.setAttribute("rotation", "0 0 0");

      marker.appendChild(model);
      modelSpawned = true;
    });

    marker.addEventListener("markerLost", () => {
      console.log("markerLost fired");

      const existingModel = marker.querySelector("a-entity[gltf-model]");
      if (existingModel) {
        marker.removeChild(existingModel);
        modelSpawned = false;
      }
    });
  });
</script>
  </body>
</html>

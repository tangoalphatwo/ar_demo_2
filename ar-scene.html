<a-scene
  embedded
  renderer="logarithmicDepthBuffer: true; alpha: true;"
  arjs="sourceType: webcam; debugUIEnabled: false;"
>
  <a-marker
    type="pattern"
    url="markers/marker.patt"
    emitevents="true"
    id="marker"
  >

    <!-- model will be injected here -->
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  console.log("ar-scene file run.");
  
  window.addEventListener("DOMContentLoaded", () => {
    const marker = document.querySelector("#marker");
    let modelSpawned = false;

    marker.addEventListener("markerFound", () => {
      console.log("Marker Found!");

      if (modelSpawned) return;
      modelSpawned = true;

      // Create model entity
      const model = document.createElement("a-entity");
      model.setAttribute("gltf-model", "models/avocado2.glb");
      model.setAttribute("scale", "0.01 0.01 0.01");

      // Set position slightly in front of vertical marker
      model.setAttribute("position", "0 0 0"); // 1 meter in front of marker
      model.setAttribute("rotation", "0 0 0");

      marker.appendChild(model);
    });

    // Optional: remove model when marker is lost
    marker.addEventListener("markerLost", () => {
      modelSpawned = false;
      const oldModel = marker.querySelector("a-entity[gltf-model]");
      if (oldModel) marker.removeChild(oldModel);
    });
  });
</script>

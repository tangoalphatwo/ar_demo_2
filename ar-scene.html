<a-scene
  embedded
  renderer="logarithmicDepthBuffer: true; alpha: true;"
  arjs="sourceType: webcam; debugUIEnabled: false;"
>
  <a-marker
    type="pattern"
    url="markers/marker.patt"
    emitevents="true"
    id="marker"
  >

    <!-- model will be injected here -->
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  console.log("ar-scene file run.");
  
  window.addEventListener("DOMContentLoaded", () => {
  const marker = document.querySelector("#marker");
  if (!marker) {
    console.error("Marker element not found!");
    return;
  }

  console.log("Marker element found.");

  marker.addEventListener("markerFound", () => {
    console.log("Marker FOUND!");

    const model = document.createElement("a-entity");
    model.setAttribute("gltf-model", "models/Avocado2.glb");
    model.setAttribute("scale", "0.025 0.025 0.025");
    model.setAttribute("position", "0 0 0");

    marker.appendChild(model);
  });

  marker.addEventListener("markerLost", () => {
    console.log("Marker LOST!");
  });
});

</script>
